[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnpj-consulta"
version = "0.3.0"
description = "Aplicativo local para consulta de CNPJ e busca reversa por socios"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Frederico" }]

dependencies = [
    # Web framework
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    # Banco de dados
    "sqlalchemy>=2.0",
    "duckdb>=1.1",  # read_csv com encoding latin-1 nativo
    # HTTP
    "httpx>=0.27",
    # Validacao e config
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
    # Util
    "unidecode>=1.3",
    "tzdata; sys_platform == 'win32'",  # fuso America/Sao_Paulo no Windows
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "respx>=0.21",
    "ruff>=0.3",
    "mypy>=1.8",
    "freezegun>=1.4",
]

[project.scripts]
cnpj = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option/Argument e fastapi.Query como default sao o idioma dessas libs
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
